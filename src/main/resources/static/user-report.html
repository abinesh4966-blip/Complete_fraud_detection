<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report · BSN FDS</title>
<link rel="stylesheet" href="css/app-shell.css">
<link rel="stylesheet" href="css/theme-dark.css">
<link rel="stylesheet" href="css/page-transitions.css">
<script>(function(){try{if(localStorage.getItem("theme")==="dark")document.documentElement.classList.add("dark");}catch(e){}})();</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&display=swap');
:root{--bsn:#003366;--bg:#eef2f7;--surface:#fff;--line:#cdd7e5;--text:#1a2332;--muted:#5c6b7c;--danger:#b42318;--success:#0f6b4c;--shadow:0 10px 28px rgba(0,38,77,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Libre Franklin',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
h1{font-size:22px;color:var(--bsn);margin-bottom:6px}
.sub{color:var(--muted);font-size:14px;margin-bottom:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);margin-bottom:14px}
.ph{padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700;color:var(--bsn)}
.pb{padding:16px}
label{display:block;font-size:12px;font-weight:600;color:var(--bsn);margin:10px 0 6px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:2px;padding:10px 12px;font:inherit;font-size:14px;background:var(--surface);color:var(--text)}
textarea{min-height:120px;resize:vertical}
.btn{border:none;border-radius:2px;padding:11px 16px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;background:var(--bsn);color:#fff;margin-top:12px}
.btn:disabled{opacity:.6;cursor:not-allowed}
.msg{margin-top:12px;font-size:13px}
.msg.ok{color:var(--success)}
.msg.err{color:var(--danger)}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;color:var(--muted);text-transform:uppercase}
.badge{display:inline-block;padding:2px 7px;border-radius:2px;font-size:11px;font-weight:700;background:#e8eef6;color:var(--bsn)}
</style>
</head>
<body>
<div style="max-width:720px;margin:0 auto;padding:8px 0 40px">
  <h1>Report suspicious activity</h1>
  <p class="sub">Submit a report to the fraud team. SuperAdmin and officers can review it in the admin console.</p>

  <div class="panel">
    <div class="ph">New report</div>
    <div class="pb">
      <label>Category</label>
      <select id="category">
        <option value="SUSPICIOUS_TRANSACTION">Suspicious transaction</option>
        <option value="UNAUTHORIZED_ACCESS">Unauthorized access</option>
        <option value="PHISHING">Phishing / scam contact</option>
        <option value="OTHER">Other</option>
      </select>
      <label>Related transaction ID (optional)</label>
      <input id="relatedTxId" placeholder="e.g. 12">
      <label>Description</label>
      <textarea id="description" placeholder="Describe what happened, when, and any amount or location..."></textarea>
      <button type="button" class="btn" id="btnSubmit">Submit report</button>
      <div class="msg" id="msg"></div>
    </div>
  </div>

  <div class="panel">
    <div class="ph">My submitted reports</div>
    <div class="pb" id="mineBox">Loading…</div>
  </div>
</div>

<script src="js/theme.js"></script>
<script src="js/app-shell.js"></script>
<script src="js/page-transitions.js"></script>
<script>
(function () {
  const API = "https://fraud-detection-system-j4bg.onrender.com";
  const username = sessionStorage.getItem("username") || "";
  const accountNumber = sessionStorage.getItem("accountNumber") || "";
  const email = sessionStorage.getItem("email") || "";
  if (sessionStorage.getItem("isLoggedIn") !== "true" || !username) {
    location.href = "access.html";
    return;
  }

  const msg = document.getElementById("msg");
  const btn = document.getElementById("btnSubmit");

  async function loadMine() {
    const box = document.getElementById("mineBox");
    try {
      const res = await fetch(API + "/api/reports/mine?username=" + encodeURIComponent(username));
      const rows = await res.json();
      if (!Array.isArray(rows) || !rows.length) {
        box.innerHTML = "<p style='color:var(--muted);font-size:13px'>No reports submitted yet.</p>";
        return;
      }
      box.innerHTML = "<table><thead><tr><th>ID</th><th>Category</th><th>Status</th><th>When</th><th>Description</th></tr></thead><tbody>" +
        rows.map(function (r) {
          return "<tr><td>#" + r.id + "</td><td>" + (r.category || "—") + "</td><td><span class='badge'>" +
            (r.status || "OPEN") + "</span></td><td>" + (r.createdAt ? String(r.createdAt).replace("T"," ").substring(0,19) : "—") +
            "</td><td>" + (r.description || "").substring(0,120) + "</td></tr>";
        }).join("") + "</tbody></table>";
    } catch (e) {
      box.innerHTML = "<p style='color:var(--danger)'>Could not load your reports.</p>";
    }
  }

  btn.onclick = async function () {
    const description = document.getElementById("description").value.trim();
    msg.className = "msg";
    msg.textContent = "Submitting…";
    btn.disabled = true;
    try {
      const res = await fetch(API + "/api/reports/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: username,
          accountNumber: accountNumber,
          email: email,
          category: document.getElementById("category").value,
          relatedTxId: document.getElementById("relatedTxId").value.trim(),
          description: description
        })
      });
      const data = await res.json();
      msg.className = "msg " + (data.success ? "ok" : "err");
      msg.textContent = data.message || (data.success ? "Submitted" : "Failed");
      if (data.success) {
        document.getElementById("description").value = "";
        document.getElementById("relatedTxId").value = "";
        loadMine();
      }
    } catch (e) {
      msg.className = "msg err";
      msg.textContent = "Server offline or waking up. Try again in a moment.";
    } finally {
      btn.disabled = false;
    }
  };

  loadMine();
})();
</script>
</body>
</html>

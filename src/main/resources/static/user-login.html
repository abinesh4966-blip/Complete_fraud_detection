<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer Login · BSN Fraud Detection</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bsn-blue:#003366; --bsn-blue-deep:#00264d; --bg:#e9eef5;
  --card:#fff; --text:#1a2332; --muted:#5c6b7c; --line:#c5d0de;
  --danger:#b42318; --danger-bg:#fdecea; --ok:#0f6b4c;
}
body{
  min-height:100vh;font-family:'Libre Franklin',system-ui,sans-serif;color:var(--text);
  background:linear-gradient(180deg, rgba(0,51,102,.12), rgba(233,238,245,.96)), var(--bg);
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.card{
  width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);
  border-radius:4px;box-shadow:0 10px 30px rgba(0,38,77,.08);padding:28px 26px 22px;
}
.brand{text-align:center;margin-bottom:18px}
.brand img{width:100px;height:auto;display:block;margin:0 auto 10px;background:transparent}
.brand h1{font-size:20px;font-weight:700;color:var(--bsn-blue)}
.brand p{font-size:13px;color:var(--muted);margin-top:4px}
label{display:block;font-size:12px;font-weight:600;margin:12px 0 6px;color:var(--bsn-blue-deep)}
input{
  width:100%;height:42px;padding:0 12px;border:1px solid var(--line);border-radius:2px;
  font:inherit;font-size:14px;background:#fff;outline:none;
}
input:focus{border-color:var(--bsn-blue);box-shadow:0 0 0 3px rgba(0,51,102,.12)}
input.invalid{border-color:var(--danger);background:var(--danger-bg)}
.err{font-size:12px;color:var(--danger);margin-top:5px;display:none}
.err.show{display:block}
.captcha-box{margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:2px;background:#f7f9fc}
.captcha-row{display:flex;gap:10px;align-items:center}
canvas{border:1px solid var(--line);border-radius:2px;background:#fff;cursor:pointer}
.btn-refresh{border:1px solid var(--line);background:#fff;height:40px;padding:0 10px;border-radius:2px;font:inherit;font-size:12px;cursor:pointer;color:var(--bsn-blue)}
button.primary{
  width:100%;height:44px;margin-top:16px;border:none;border-radius:2px;cursor:pointer;
  background:var(--bsn-blue);color:#fff;font:inherit;font-size:14px;font-weight:700;
}
button.primary:disabled{opacity:.65;cursor:not-allowed}
.msg{margin-top:12px;padding:10px 12px;border-radius:2px;font-size:13px;display:none}
.msg.show{display:block}
.msg.error{background:var(--danger-bg);color:var(--danger);border:1px solid #f0b4ae}
.msg.ok{background:#e8f6ef;color:var(--ok);border:1px solid #b7e0cc}
.links{display:flex;justify-content:space-between;gap:8px;margin-top:14px;font-size:13px}
.links a{color:var(--bsn-blue);font-weight:600;text-decoration:none}
.hidden{display:none !important}
.panel{margin-top:8px}
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="img/bsn-logo.jpg" alt="BSN" onerror="this.style.display='none'">
      <h1>Customer Login</h1>
      <p>Sign in with username or email</p>
    </div>

    <!-- LOGIN -->
    <form id="loginForm" class="panel" novalidate>
      <label for="login">Username or Email</label>
      <input id="login" autocomplete="username" placeholder="username or name@email.com">
      <div class="err" id="errLogin">Username or email is required</div>

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="Your password">
      <div class="err" id="errPassword">Password is required</div>

      <div class="captcha-box">
        <label style="margin-top:0">CAPTCHA</label>
        <div class="captcha-row">
          <canvas id="captchaCanvas" width="140" height="44"></canvas>
          <button type="button" class="btn-refresh" id="btnRefresh">Refresh</button>
        </div>
        <input id="captchaInput" style="margin-top:10px" placeholder="Enter the code above" autocomplete="off">
        <div class="err" id="errCaptcha">CAPTCHA is required</div>
      </div>

      <button class="primary" id="btnLogin" type="submit">Login</button>
      <div class="msg" id="msg"></div>
    </form>

    <!-- FORGOT -->
    <form id="forgotForm" class="panel hidden" novalidate>
      <label for="forgotLogin">Username or Email</label>
      <input id="forgotLogin" placeholder="Account to reset">
      <div class="err" id="errForgotLogin">Required</div>

      <label for="otp">Reset code (OTP)</label>
      <input id="otp" placeholder="6-digit code">
      <div class="hint" style="font-size:11px;color:#5c6b7c;margin-top:4px">Request a code first. Demo may show the code on screen.</div>

      <label for="newPassword">New password</label>
      <input id="newPassword" type="password" placeholder="Min 8, uppercase, number, special">
      <div class="err" id="errNewPassword"></div>

      <button class="primary" type="button" id="btnSendOtp">Send reset code</button>
      <button class="primary" type="submit" style="margin-top:8px;background:#0f6b4c">Update password</button>
      <div class="msg" id="msgForgot"></div>
    </form>

    <div class="links">
      <a href="user-register.html">Create account</a>
      <a href="#" id="toggleForgot">Forgot password?</a>
    </div>
    <div class="links" style="margin-top:8px">
      <a href="access.html">← Back to access</a>
      <a href="admin-login.html">Admin login</a>
    </div>
  </div>

<script>
const API = "https://fraud-detection-system-j4bg.onrender.com";
let captchaId="", captchaCode="";
const $ = id => document.getElementById(id);
function setInvalid(input, errEl, on, text){
  input.classList.toggle("invalid", on);
  if(text) errEl.textContent=text;
  errEl.classList.toggle("show", on);
}
function show(el, text, err){
  el.textContent=text; el.className="msg show "+(err?"error":"ok");
}
function drawCaptcha(code){
  const c=$("captchaCanvas"), ctx=c.getContext("2d");
  ctx.clearRect(0,0,c.width,c.height);
  ctx.fillStyle="#f4f7fb"; ctx.fillRect(0,0,c.width,c.height);
  ctx.font="bold 22px Libre Franklin,sans-serif"; ctx.fillStyle="#003366"; ctx.textBaseline="middle";
  let x=16; for(const ch of code){ ctx.fillText(ch,x,22); x+=24; }
}
async function loadCaptcha(){
  try{
    const res=await fetch(API+"/api/auth/captcha");
    const data=await res.json();
    captchaId=data.captchaId; captchaCode=data.captchaCode||"";
    drawCaptcha(captchaCode); $("captchaInput").value="";
    setInvalid($("captchaInput"),$("errCaptcha"),false);
  }catch(e){ show($("msg"),"CAPTCHA unavailable — server may be waking up.",true); }
}
$("btnRefresh").onclick=loadCaptcha;
$("captchaCanvas").onclick=loadCaptcha;

$("toggleForgot").onclick=(e)=>{
  e.preventDefault();
  const f=$("forgotForm"), l=$("loginForm");
  const showForgot=f.classList.contains("hidden");
  f.classList.toggle("hidden", !showForgot);
  l.classList.toggle("hidden", showForgot);
  $("toggleForgot").textContent = showForgot ? "Back to login" : "Forgot password?";
};

$("loginForm").onsubmit=async(e)=>{
  e.preventDefault();
  $("msg").className="msg";
  let ok=true;
  const login=$("login").value.trim();
  const password=$("password").value;
  const captchaInput=$("captchaInput").value.trim();
  if(!login){ setInvalid($("login"),$("errLogin"),true,"Username or email is required"); ok=false; }
  else setInvalid($("login"),$("errLogin"),false);
  if(!password){ setInvalid($("password"),$("errPassword"),true,"Password is required"); ok=false; }
  else setInvalid($("password"),$("errPassword"),false);
  if(!captchaInput){ setInvalid($("captchaInput"),$("errCaptcha"),true,"CAPTCHA is required"); ok=false; }
  else setInvalid($("captchaInput"),$("errCaptcha"),false);
  if(!ok) return;

  $("btnLogin").disabled=true; $("btnLogin").textContent="Signing in…";
  try{
    const res=await fetch(API+"/api/auth/login",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ login, username:login, password, captchaId, captchaInput, require2fa:"false" })
    });
    const data=await res.json().catch(()=>({}));
    if(!res.ok || data.success===false){
      const message=data.message||"Login failed";
      if(data.field==="captcha") setInvalid($("captchaInput"),$("errCaptcha"),true,message);
      show($("msg"), message, true);
      await loadCaptcha();
      return;
    }
    sessionStorage.setItem("isLoggedIn", "true");
    sessionStorage.setItem("username", data.username);
    sessionStorage.setItem("role", data.role||"USER");
    sessionStorage.setItem("accountNumber", data.accountNumber||"");
    sessionStorage.setItem("fullName", data.fullName||"");
    sessionStorage.setItem("email", data.email||"");
    show($("msg"),"Login successful. Redirecting…", false);
    setTimeout(()=> location.href="user-dashboard.html", 500);
  }catch(err){
    show($("msg"),"Server offline or waking up. Wait and try again.", true);
  }finally{
    $("btnLogin").disabled=false; $("btnLogin").textContent="Login";
  }
};

$("btnSendOtp").onclick=async()=>{
  const login=$("forgotLogin").value.trim();
  if(!login){ setInvalid($("forgotLogin"),$("errForgotLogin"),true,"Required"); return; }
  setInvalid($("forgotLogin"),$("errForgotLogin"),false);
  try{
    const res=await fetch(API+"/api/auth/forgot-password",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ login })
    });
    const data=await res.json();
    let t=data.message||"If the account exists, a code was issued";
    if(data.demoOtp) t += " | Demo OTP: " + data.demoOtp;
    show($("msgForgot"), t, false);
  }catch(e){ show($("msgForgot"),"Server offline", true); }
};

$("forgotForm").onsubmit=async(e)=>{
  e.preventDefault();
  const login=$("forgotLogin").value.trim();
  const otp=$("otp").value.trim();
  const newPassword=$("newPassword").value;
  try{
    const res=await fetch(API+"/api/auth/reset-password",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ login, otp, newPassword })
    });
    const data=await res.json();
    show($("msgForgot"), data.message|| (data.success?"Updated":"Failed"), !data.success);
    if(data.success){ setTimeout(()=> { $("toggleForgot").click(); }, 800); }
  }catch(e){ show($("msgForgot"),"Server offline", true); }
};

loadCaptcha();
</script>
</body>
</html>

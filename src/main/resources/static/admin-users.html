<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Users · BSN FDS</title>
<link rel="stylesheet" href="css/app-shell.css">
<link rel="stylesheet" href="css/theme-dark.css">
<link rel="stylesheet" href="css/page-transitions.css">
<script>(function(){try{if(localStorage.getItem("theme")==="dark")document.documentElement.classList.add("dark");}catch(e){}})();</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&display=swap');
:root{
  --bsn:#003366; --bsn-deep:#00244d; --bg:#eef2f7; --surface:#fff; --line:#cdd7e5;
  --text:#1a2332; --muted:#5c6b7c; --danger:#b42318; --success:#0f6b4c;
  --shadow:0 10px 28px rgba(0,38,77,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Libre Franklin',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
h1{font-size:22px;color:var(--bsn);margin-bottom:4px}
.sub{color:var(--muted);font-size:14px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px;box-shadow:var(--shadow)}
.stat .label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase}
.stat .value{font-size:20px;font-weight:700;color:var(--bsn);margin-top:4px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);margin-bottom:14px}
.ph{padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700;color:var(--bsn);font-size:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.pb{padding:16px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input,select{border:1px solid var(--line);border-radius:2px;padding:9px 11px;font:inherit;font-size:13px;background:var(--surface);color:var(--text)}
.btn{border:none;border-radius:2px;padding:9px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.btn-primary{background:var(--bsn);color:#fff}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--bsn)}
.btn-danger{background:var(--danger);color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;text-transform:uppercase;color:var(--muted);background:rgba(0,51,102,.06)}
.badge{display:inline-block;padding:2px 7px;border-radius:2px;font-size:11px;font-weight:700}
.badge.SUPER_ADMIN{background:#e8eef6;color:#003366}
.badge.ADMIN{background:#e7f0fa;color:#0a4d8c}
.badge.USER{background:#e8f6ef;color:#0f6b4c}
.msg{font-size:13px;margin-top:10px;display:none}
.msg.show{display:block}
.msg.ok{color:var(--success)}
.msg.err{color:var(--danger)}
.hidden{display:none!important}
label{display:block;font-size:12px;font-weight:600;color:var(--bsn);margin:8px 0 4px}
</style>
</head>
<body>
<div style="max-width:1100px;margin:0 auto;padding:8px 0 40px">
  <h1>Users &amp; admin control</h1>
  <p class="sub">Signed in as <strong id="whoLabel">—</strong></p>

  <div class="stats">
    <div class="stat"><div class="label">Total users</div><div class="value" id="sTotal">0</div></div>
    <div class="stat"><div class="label">Customers</div><div class="value" id="sUsers">0</div></div>
    <div class="stat"><div class="label">Admins</div><div class="value" id="sAdmins">0</div></div>
    <div class="stat"><div class="label">SuperAdmins</div><div class="value" id="sSuper">0</div></div>
    <div class="stat"><div class="label">Locked</div><div class="value" id="sLocked">0</div></div>
    <div class="stat"><div class="label">Flagged tx</div><div class="value" id="sFlag">0</div></div>
  </div>

  <div class="panel hidden" id="superPanel">
    <div class="ph">Create admin account (SuperAdmin only)</div>
    <div class="pb">
      <div class="toolbar">
        <input id="aFullName" placeholder="Full name">
        <input id="aUsername" placeholder="Username">
        <input id="aEmail" placeholder="Email">
        <input id="aPassword" type="password" placeholder="Temp password">
        <button type="button" class="btn btn-primary" id="btnCreateAdmin">Create admin</button>
      </div>
      <div class="msg" id="createMsg"></div>
    </div>
  </div>

  <div class="panel">
    <div class="ph">
      <span>All accounts</span>
      <div class="toolbar">
        <select id="roleFilter">
          <option value="ALL">All roles</option>
          <option value="USER">Customers</option>
          <option value="ADMIN">Admins</option>
          <option value="SUPER_ADMIN">SuperAdmins</option>
        </select>
        <input id="search" placeholder="Search username / email / name">
        <button type="button" class="btn btn-ghost" id="btnRefresh">Refresh</button>
      </div>
    </div>
    <div class="pb" style="padding-top:0;overflow:auto">
      <table>
        <thead>
          <tr>
            <th>User</th><th>Role</th><th>Account</th><th>Activity</th><th>Risk</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="6">Loading…</td></tr>
        </tbody>
      </table>
      <div class="msg" id="tableMsg"></div>
    </div>
  </div>
</div>

<script src="js/theme.js"></script>
<script src="js/app-shell.js"></script>
<script src="js/page-transitions.js"></script>
<script>
(function () {
  const API = "https://fraud-detection-system-j4bg.onrender.com";
  const role = (sessionStorage.getItem("role") || "").toUpperCase();
  const username = sessionStorage.getItem("username") || "";
  const fullName = sessionStorage.getItem("fullName") || "";
  const isLoggedIn = sessionStorage.getItem("isLoggedIn") === "true";

  if (!isLoggedIn || (role !== "ADMIN" && role !== "SUPER_ADMIN")) {
    location.href = "access.html";
    return;
  }

  const whoText = (fullName || username || "Admin") + " · " + (role || "STAFF");
  const whoEl = document.getElementById("whoLabel");
  if (whoEl) whoEl.textContent = whoText;

  if (role === "SUPER_ADMIN") {
    const panel = document.getElementById("superPanel");
    if (panel) panel.classList.remove("hidden");
  }

  function showMsg(id, text, ok) {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = text || "";
    el.className = "msg show " + (ok ? "ok" : "err");
  }

  let allRows = [];

  async function loadSummary() {
    try {
      const res = await fetch(API + "/api/admin/users/summary");
      if (!res.ok) throw new Error("summary " + res.status);
      const d = await res.json();
      document.getElementById("sTotal").textContent = d.totalUsers ?? 0;
      document.getElementById("sUsers").textContent = d.userAccounts ?? 0;
      document.getElementById("sAdmins").textContent = d.adminAccounts ?? 0;
      document.getElementById("sSuper").textContent = d.superAdminAccounts ?? 0;
      document.getElementById("sLocked").textContent = d.lockedAccounts ?? 0;
      document.getElementById("sFlag").textContent = d.flaggedTransactions ?? 0;
    } catch (e) {
      showMsg("tableMsg", "Could not load summary. Server may be waking up.", false);
    }
  }

  async function loadList() {
    const tb = document.getElementById("tbody");
    try {
      const res = await fetch(API + "/api/admin/users/list");
      if (!res.ok) throw new Error("list HTTP " + res.status);
      const data = await res.json();
      if (!Array.isArray(data)) {
        throw new Error("List response is not an array");
      }
      allRows = data;
      renderTable();
      if (allRows.length === 0) {
        showMsg("tableMsg", "No users in database yet.", false);
      } else {
        showMsg("tableMsg", allRows.length + " account(s) loaded.", true);
      }
    } catch (e) {
      console.error(e);
      tb.innerHTML = "<tr><td colspan='6'>Failed to load users: " + (e.message || e) + "</td></tr>";
      showMsg("tableMsg", "List failed. Check API /api/admin/users/list", false);
    }
  }

  function renderTable() {
    const q = (document.getElementById("search").value || "").toLowerCase();
    const rf = document.getElementById("roleFilter").value;
    const tb = document.getElementById("tbody");
    const rows = allRows.filter(function (u) {
      const r = String(u.role || "").toUpperCase();
      if (rf !== "ALL" && r !== rf) return false;
      if (!q) return true;
      const blob = [u.username, u.email, u.fullName, u.accountNumber].join(" ").toLowerCase();
      return blob.indexOf(q) >= 0;
    });

    if (!rows.length) {
      tb.innerHTML = "<tr><td colspan='6'>No accounts match this filter.</td></tr>";
      return;
    }

    tb.innerHTML = rows.map(function (u) {
      const r = String(u.role || "USER").toUpperCase();
      const locked = u.locked ? " · LOCKED" : "";
      const name = u.fullName || u.username || "—";
      const last = u.lastLoginAt ? String(u.lastLoginAt).replace("T", " ").substring(0, 19) : "Never";
      const flagged = u.flaggedCount != null ? u.flaggedCount : 0;
      const total = u.txCount != null ? u.txCount : 0;
      let actions = "";
      if (u.locked) {
        actions += "<button type='button' class='btn btn-ghost' data-unlock='" + u.id + "'>Unlock</button> ";
      }
      if (role === "SUPER_ADMIN" && r === "ADMIN") {
        actions += "<button type='button' class='btn btn-danger' data-remove='" + u.id + "'>Remove</button>";
      }
      if (!actions) actions = "—";
      return "<tr>" +
        "<td><strong>" + name + "</strong><br><span style='color:var(--muted);font-size:12px'>" +
        (u.username || "") + "<br>" + (u.email || "") + "</span></td>" +
        "<td><span class='badge " + r + "'>" + r + locked + "</span></td>" +
        "<td>" + (u.accountNumber || "—") + "</td>" +
        "<td>Last login: " + last + "</td>" +
        "<td>" + flagged + " flagged / " + total + " tx</td>" +
        "<td>" + actions + "</td>" +
        "</tr>";
    }).join("");
  }

  async function loadAll() {
    await loadSummary();
    await loadList();
  }

  document.getElementById("tbody").addEventListener("click", async function (e) {
    const unlockId = e.target.getAttribute("data-unlock");
    const removeId = e.target.getAttribute("data-remove");
    if (unlockId) {
      try {
        const res = await fetch(API + "/api/admin/users/" + unlockId + "/unlock", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ actorUsername: username })
        });
        const d = await res.json();
        showMsg("tableMsg", d.message || "Unlocked", !!d.success);
        await loadAll();
      } catch (err) {
        showMsg("tableMsg", "Unlock failed", false);
      }
    }
    if (removeId) {
      if (!confirm("Remove this admin account?")) return;
      try {
        const url = API + "/api/admin/users/admins/" + removeId + "?actorUsername=" + encodeURIComponent(username);
        const res = await fetch(url, { method: "DELETE" });
        const d = await res.json();
        showMsg("tableMsg", d.message || "Done", !!d.success);
        await loadAll();
      } catch (err) {
        showMsg("tableMsg", "Remove failed", false);
      }
    }
  });

  document.getElementById("btnCreateAdmin").addEventListener("click", async function () {
    const body = {
      actorUsername: username,
      fullName: document.getElementById("aFullName").value.trim(),
      username: document.getElementById("aUsername").value.trim(),
      email: document.getElementById("aEmail").value.trim(),
      password: document.getElementById("aPassword").value
    };
    try {
      const res = await fetch(API + "/api/admin/users/admins", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      const d = await res.json();
      showMsg("createMsg", d.message || (d.success ? "Created" : "Failed"), !!d.success);
      if (d.success) {
        document.getElementById("aFullName").value = "";
        document.getElementById("aUsername").value = "";
        document.getElementById("aEmail").value = "";
        document.getElementById("aPassword").value = "";
        await loadAll();
      }
    } catch (e) {
      showMsg("createMsg", "Server offline or waking up", false);
    }
  });

  document.getElementById("roleFilter").addEventListener("change", renderTable);
  document.getElementById("search").addEventListener("input", renderTable);
  document.getElementById("btnRefresh").addEventListener("click", loadAll);

  loadAll();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login · BSN Fraud Detection</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bsn-blue:#003366; --bsn-blue-deep:#001a33;
  --card:#fff; --text:#1a2332; --muted:#5c6b7c; --line:#c5d0de;
  --danger:#b42318; --danger-bg:#fdecea; --ok:#0f6b4c;
}
body{
  min-height:100vh;font-family:'Libre Franklin',system-ui,sans-serif;color:var(--text);
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(0,82,163,.45), transparent 55%),
    linear-gradient(165deg,#0b1a33,#102844 50%,#0d213f);
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.card{
  width:100%;max-width:420px;background:var(--card);border:1px solid #d7e0ec;
  border-radius:4px;box-shadow:0 16px 40px rgba(0,0,0,.35);padding:28px 26px 22px;
}
.brand{text-align:center;margin-bottom:18px}
.brand img{width:100px;height:auto;display:block;margin:0 auto 10px;background:transparent}
.brand h1{font-size:20px;font-weight:700;color:var(--bsn-blue)}
.brand p{font-size:12px;color:var(--muted);margin-top:4px}
.badge{
  display:inline-block;margin-top:8px;padding:4px 10px;border-radius:2px;
  font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:#fff;background:var(--bsn-blue);
}
label{display:block;font-size:12px;font-weight:600;margin:12px 0 6px;color:var(--bsn-blue-deep)}
input{
  width:100%;height:42px;padding:0 12px;border:1px solid var(--line);border-radius:2px;
  font:inherit;font-size:14px;outline:none;
}
input:focus{border-color:var(--bsn-blue);box-shadow:0 0 0 3px rgba(0,51,102,.12)}
input.invalid{border-color:var(--danger);background:var(--danger-bg)}
.err{font-size:12px;color:var(--danger);margin-top:5px;display:none}
.err.show{display:block}
.captcha-box{margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:2px;background:#f7f9fc}
.captcha-row{display:flex;gap:10px;align-items:center}
canvas{border:1px solid var(--line);border-radius:2px;background:#fff;cursor:pointer}
.btn-refresh{border:1px solid var(--line);background:#fff;height:40px;padding:0 10px;border-radius:2px;font:inherit;font-size:12px;cursor:pointer;color:var(--bsn-blue)}
button.primary{
  width:100%;height:44px;margin-top:16px;border:none;border-radius:2px;cursor:pointer;
  background:var(--bsn-blue);color:#fff;font:inherit;font-size:14px;font-weight:700;
}
button.primary:disabled{opacity:.65}
.msg{margin-top:12px;padding:10px 12px;border-radius:2px;font-size:13px;display:none}
.msg.show{display:block}
.msg.error{background:var(--danger-bg);color:var(--danger);border:1px solid #f0b4ae}
.msg.ok{background:#e8f6ef;color:var(--ok);border:1px solid #b7e0cc}
.foot{text-align:center;margin-top:14px;font-size:12px;color:var(--muted)}
.foot a{color:var(--bsn-blue);font-weight:600;text-decoration:none}
</style>
<link rel="stylesheet" href="css/page-transitions.css">
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="img/bsn-logo.jpg" alt="BSN" onerror="this.style.display='none'">
      <h1>Admin Login</h1>
      <div class="badge">Fraud Control Centre</div>
      <p>Admin accounts are issued by SuperAdmin only</p>
    </div>

    <form id="form" novalidate>
      <label for="login">Username or Email</label>
      <input id="login" autocomplete="username">
      <div class="err" id="errLogin">Required</div>

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password">
      <div class="err" id="errPassword">Required</div>

      <div class="captcha-box">
        <label style="margin-top:0">CAPTCHA</label>
        <div class="captcha-row">
          <canvas id="captchaCanvas" width="140" height="44"></canvas>
          <button type="button" class="btn-refresh" id="btnRefresh">Refresh</button>
        </div>
        <input id="captchaInput" style="margin-top:10px" placeholder="Enter the code above" autocomplete="off">
        <div class="err" id="errCaptcha">CAPTCHA is required</div>
      </div>

      <button class="primary" id="btn" type="submit">Login as Admin</button>
      <div class="msg" id="msg"></div>
    </form>

    <div class="foot">
      <a href="access.html">← Back to access</a><br><br>
      No public admin registration. Contact SuperAdmin.
    </div>
  </div>

<script>
const API = "https://fraud-detection-system-j4bg.onrender.com";
let captchaId="", captchaCode="";
const $ = id => document.getElementById(id);
function setInvalid(input, errEl, on, text){
  input.classList.toggle("invalid", on);
  if(text) errEl.textContent=text;
  errEl.classList.toggle("show", on);
}
function drawCaptcha(code){
  const c=$("captchaCanvas"), ctx=c.getContext("2d");
  ctx.clearRect(0,0,c.width,c.height);
  ctx.fillStyle="#f4f7fb"; ctx.fillRect(0,0,c.width,c.height);
  ctx.font="bold 22px Libre Franklin,sans-serif"; ctx.fillStyle="#003366"; ctx.textBaseline="middle";
  let x=16; for(const ch of code){ ctx.fillText(ch,x,22); x+=24; }
}
async function loadCaptcha(){
  try{
    const res=await fetch(API+"/api/auth/captcha");
    const data=await res.json();
    captchaId=data.captchaId; captchaCode=data.captchaCode||"";
    drawCaptcha(captchaCode); $("captchaInput").value="";
  }catch(e){
    $("msg").className="msg show error";
    $("msg").textContent="CAPTCHA unavailable — wait for server wake-up";
  }
}
$("btnRefresh").onclick=loadCaptcha;
$("captchaCanvas").onclick=loadCaptcha;

$("form").onsubmit=async(e)=>{
  e.preventDefault();
  $("msg").className="msg";
  let ok=true;
  const login=$("login").value.trim();
  const password=$("password").value;
  const captchaInput=$("captchaInput").value.trim();
  if(!login){ setInvalid($("login"),$("errLogin"),true,"Username or email is required"); ok=false; }
  else setInvalid($("login"),$("errLogin"),false);
  if(!password){ setInvalid($("password"),$("errPassword"),true,"Password is required"); ok=false; }
  else setInvalid($("password"),$("errPassword"),false);
  if(!captchaInput){ setInvalid($("captchaInput"),$("errCaptcha"),true,"CAPTCHA is required"); ok=false; }
  else setInvalid($("captchaInput"),$("errCaptcha"),false);
  if(!ok) return;

  $("btn").disabled=true; $("btn").textContent="Signing in…";
  try{
    const res=await fetch(API+"/api/auth/login",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ login, username:login, password, captchaId, captchaInput })
    });
    const data=await res.json().catch(()=>({}));
    if(!res.ok || data.success===false){
      const message=data.message||"Login failed";
      if(data.field==="captcha") setInvalid($("captchaInput"),$("errCaptcha"),true,message);
      $("msg").className="msg show error"; $("msg").textContent=message;
      await loadCaptcha();
      return;
    }
    const role=(data.role||"").toUpperCase();
    if(role!=="ADMIN" && role!=="SUPER_ADMIN"){
      $("msg").className="msg show error";
      $("msg").textContent="This account is not an admin. Use Customer Login.";
      await loadCaptcha();
      return;
    }
    sessionStorage.setItem("isLoggedIn", "true");
    sessionStorage.setItem("username", data.username);
    sessionStorage.setItem("role", data.role);
    sessionStorage.setItem("fullName", data.fullName||"");
    sessionStorage.setItem("email", data.email||"");
    sessionStorage.setItem("accountNumber", data.accountNumber||"");
    $("msg").className="msg show ok"; $("msg").textContent="Welcome. Redirecting…";
    setTimeout(()=> location.href="dashboard.html", 500);
  }catch(err){
    $("msg").className="msg show error";
    $("msg").textContent="Server offline or waking up. Wait and try again.";
  }finally{
    $("btn").disabled=false; $("btn").textContent="Login as Admin";
  }
};
loadCaptcha();
</script>
<script src="js/page-transitions.js" defer></script>
</body>
</html>

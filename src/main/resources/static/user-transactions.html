<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Transactions - BSN</title>

    <style>

@import url('https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&display=swap');
:root {
    --bg: #e9eef5;
    --surface: #ffffff;
    --border: #c5d0de;
    --text: #1a2332;
    --muted: #5c6b7c;
    --accent: #003366;
    --accent-hover: #00244d;
    --clay: #c4a35a;
    --danger: #b42318;
    --success: #0f6b4c;
    --warn: #a67c2a;
    --soft: #f4f7fb;
}
body.dark {
    --bg: #0b1a33;
    --surface: #12233f;
    --border: #2a3f5f;
    --text: #e8eef6;
    --muted: #9aadc2;
    --accent: #6ea8e0;
    --accent-hover: #8fbfec;
    --clay: #d4b56a;
    --danger: #f0a29a;
    --success: #7dba9a;
    --warn: #e0b45c;
    --soft: #18304f;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: var(--bg); color: var(--text);
    font-family: 'Libre Franklin', system-ui, sans-serif; min-height: 100vh;
    transition: background .25s, color .25s;
}
.navbar {
    background: #003366; color: #fff;
    border-bottom: 1px solid rgba(255,255,255,.12);
    padding: 14px 22px; display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 10px;
}
body.dark .navbar { background: #061224; }
.navbar h2 { color: #fff; font-size: 16px; font-weight: 700; letter-spacing: .02em; }
.nav-links { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.nav-links a, .nav-links button {
    color: #fff; text-decoration: none; background: transparent;
    border: 1px solid rgba(255,255,255,.35); padding: 7px 12px; border-radius: 2px;
    font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
}
.nav-links a:hover, .nav-links button:hover { background: rgba(255,255,255,.12); }
.logout-btn { background: rgba(180,35,24,.25) !important; border-color: rgba(240,180,174,.5) !important; }
.user-info { color: rgba(255,255,255,.85); font-size: 13px; }
.container { max-width: 1200px; margin: 0 auto; padding: 22px 16px 40px; }
.header-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.header-row h1 { font-size: 22px; color: var(--accent); font-weight: 700; }
body.dark .header-row h1 { color: #9ec5ea; }
.live-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.live-status { font-size: 12px; color: var(--muted); font-weight: 600; }
.btn {
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    padding: 8px 14px; border-radius: 2px; font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: inherit;
}
.btn:hover { filter: brightness(0.98); }
.btn-start { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-stop { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn-upload { background: var(--accent); color: #fff; border-color: var(--accent); }
.cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 14px 0 18px; }
@media (max-width: 900px) { .cards { grid-template-columns: repeat(2, 1fr); } }
.card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 2px; padding: 14px 16px;
}
.card h3 { font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
.card .number { font-size: 26px; font-weight: 700; color: var(--accent); }
.card.suspicious .number { color: var(--danger); }
.card.normal .number { color: var(--success); }
.card.false-positive .number { color: var(--warn); }
.main-grid { display: grid; grid-template-columns: 1.1fr 1fr 1fr; gap: 14px; }
@media (max-width: 1000px) { .main-grid { grid-template-columns: 1fr; } }
.panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: 2px; overflow: hidden;
    display: flex; flex-direction: column; min-height: 280px;
}
.panel-header {
    padding: 12px 14px; border-bottom: 1px solid var(--border);
    font-size: 13px; font-weight: 700; color: var(--accent);
    display: flex; justify-content: space-between; align-items: center;
}
.panel-body { padding: 12px 14px; overflow: auto; max-height: 420px; flex: 1; }
.empty { color: var(--muted); font-size: 13px; text-align: center; padding: 28px 10px; line-height: 1.5; }
.upload-box { padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.upload-msg { font-size: 12px; color: var(--muted); width: 100%; }
.feed-item {
    border: 1px solid var(--border); border-radius: 2px; padding: 10px; margin-bottom: 8px;
    background: var(--soft); cursor: pointer; font-size: 13px;
}
.feed-item .row { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
.feed-item .acc { font-weight: 700; color: var(--accent); }
.feed-item .amt { font-weight: 600; }
.status-line { font-size: 12px; font-weight: 700; margin-top: 4px; }
.status-line.flagged { color: var(--danger); }
.status-line.cleared { color: var(--success); }
.status-line.processing { color: var(--warn); }
.reason { font-size: 12px; color: var(--muted); margin-top: 4px; }

</style>
</head>

<body>

<div class="navbar">

    <h2>BSN</h2>

    <div class="nav-links">
        <a href="user-dashboard.html">Dashboard</a>
        <a href="user-transactions.html">My Transactions</a>
        <a href="user-alerts.html">Alerts</a>
        <a href="user-report.html">Report</a>

        <button class="logout-btn" onclick="logout()">
            Logout
        </button>
    </div>

</div>


<div class="container">

    <div class="card">

        <div class="header-row">

            <h1>My Transactions</h1>

            <button
                class="btn-danger"
                onclick="clearMyHistory()">
                Clear Transaction History
            </button>

        </div>


        <div
            id="message"
            class="message">
        </div>


        <div id="content">
            <div class="empty">
                Loading...
            </div>
        </div>

    </div>

</div>


<script>

    /*
     * USER ACCESS CHECK
     */
    if (
        sessionStorage.getItem("isLoggedIn") !== "true" ||
        sessionStorage.getItem("role") !== "USER"
    ) {
        window.location.href = "access.html";
    }


    const accountNumber =
        sessionStorage.getItem("accountNumber") || "";


    /*
     * LOGOUT
     */
    function logout() {

        sessionStorage.clear();

        window.location.href = "access.html";
    }


    /*
     * DISPLAY MESSAGE
     */
    function showMessage(message, type) {

        const element =
            document.getElementById("message");

        element.textContent = message;

        element.className =
            "message " +
            (type === "success"
                ? "message-success"
                : "message-error");

        element.style.display = "block";

        setTimeout(() => {

            element.style.display = "none";

        }, 4000);
    }


    /*
     * CLEAR CURRENT USER'S TRANSACTION HISTORY
     */
    async function clearMyHistory() {

        if (!accountNumber) {

            showMessage(
                "Unable to identify your account.",
                "error"
            );

            return;
        }


        const confirmed = confirm(
            "Clear Transaction History?\n\n" +
            "This will permanently delete all transactions " +
            "belonging to your account.\n\n" +
            "This action cannot be undone."
        );


        if (!confirmed) {
            return;
        }


        try {

            const response = await fetch(
                "https://fraud-detection-system-j4bg.onrender.com/api/transactions/clear-mine" +
                "?accountNumber=" +
                encodeURIComponent(accountNumber),
                {
                    method: "DELETE"
                }
            );


            if (!response.ok) {

                throw new Error(
                    "Server returned " + response.status
                );
            }


            const result =
                await response.json();


            if (result.success) {

                showMessage(
                    result.deleted +
                    " transaction(s) cleared successfully.",
                    "success"
                );

                await load();

            } else {

                showMessage(
                    result.message ||
                    "Failed to clear transaction history.",
                    "error"
                );
            }


        } catch (error) {

            console.error(error);

            showMessage(
                "Unable to connect to the server.",
                "error"
            );
        }
    }


    /*
     * LOAD USER TRANSACTIONS
     */
    async function load() {

        try {

            const response = await fetch(
                "https://fraud-detection-system-j4bg.onrender.com/api/transactions/my-history?accountNumber=" +
                encodeURIComponent(accountNumber)
            );


            if (!response.ok) {

                throw new Error(
                    "Server returned " + response.status
                );
            }


            const all =
                await response.json();


            const mine =
                accountNumber
                    ? all.filter(
                        tx =>
                            String(tx.accountNumber) ===
                            String(accountNumber)
                    )
                    : [];


            if (mine.length === 0) {

                document.getElementById(
                    "content"
                ).innerHTML =
                    "<div class='empty'>" +
                    "No transactions found for your account." +
                    "</div>";

                return;
            }


            let html = `
                <table>

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>Amount</th>
                            <th>Type</th>
                            <th>Location</th>
                            <th>Risk</th>
                            <th>Status</th>
                            <th>Time</th>
                        </tr>

                    </thead>

                    <tbody>
            `;


            [...mine]
                .reverse()
                .forEach(tx => {

                    const statusClass =
                        tx.status === "SUSPICIOUS" &&
                        !tx.falsePositive
                            ? "status-suspicious"
                            : "status-normal";


                    const statusText =
                        tx.falsePositive
                            ? "FALSE POSITIVE"
                            : (
                                tx.status === "SUSPICIOUS"
                                    ? "FLAGGED"
                                    : "CLEARED"
                            );


                    html += `
                        <tr>

                            <td>
                                ${tx.id}
                            </td>

                            <td>
                                RM ${Number(tx.amount).toFixed(2)}
                            </td>

                            <td>
                                ${tx.transactionType || "-"}
                            </td>

                            <td>
                                ${tx.location || "-"}
                            </td>

                            <td>
                                ${Number(tx.riskScore || 0)}%
                            </td>

                            <td class="${statusClass}">
                                ${statusText}
                            </td>

                            <td>
                                ${
                                    tx.timestamp
                                        ? tx.timestamp
                                            .replace("T", " ")
                                            .substring(0, 19)
                                        : "-"
                                }
                            </td>

                        </tr>
                    `;
                });


            html += `
                    </tbody>

                </table>
            `;


            document.getElementById(
                "content"
            ).innerHTML = html;


        } catch (error) {

            console.error(error);

            document.getElementById(
                "content"
            ).innerHTML =
                "<div class='empty'>" +
                "Error loading transactions." +
                "</div>";
        }
    }


    /*
     * INITIAL LOAD
     */
    load();

</script>

</body>
</html>

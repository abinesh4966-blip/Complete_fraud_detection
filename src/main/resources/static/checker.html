<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transaction Checker · BSN FDS</title>
<link rel="stylesheet" href="css/page-transitions.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&display=swap');
:root{
  --bsn:#003366; --bsn-deep:#00244d; --bsn-soft:#e8eef6;
  --bg:#eef2f7; --surface:#ffffff; --line:#cdd7e5; --text:#1a2332; --muted:#5c6b7c;
  --danger:#b42318; --danger-bg:#fdecea; --success:#0f6b4c; --success-bg:#e8f6ef;
  --warn:#9a6b12; --shadow:0 10px 28px rgba(0,38,77,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Libre Franklin',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.navbar{background:var(--bsn);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:36px;height:36px;border-radius:2px;background:rgba(255,255,255,.12);display:grid;place-items:center;font-weight:700;font-size:12px}
.brand h2{font-size:15px;font-weight:700}
.brand span{display:block;font-size:11px;opacity:.75}
.nav-links{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.nav-links .who{font-size:13px;opacity:.9;margin-right:4px}
.nav-links a,.nav-links button{
  color:#fff;text-decoration:none;background:transparent;border:1px solid rgba(255,255,255,.32);
  padding:8px 12px;border-radius:2px;font:inherit;font-size:13px;font-weight:600;cursor:pointer
}
.nav-links a:hover,.nav-links button:hover{background:rgba(255,255,255,.12)}
.nav-links a.active{background:#fff;color:var(--bsn);border-color:#fff}
.logout-btn{border-color:rgba(240,180,174,.55)!important;background:rgba(180,35,24,.22)!important}
.page{max-width:560px;margin:0 auto;padding:32px 16px 48px}
.page-title h1{font-size:24px;color:var(--bsn);font-weight:700;margin-bottom:6px}
.page-title p{color:var(--muted);font-size:14px;margin-bottom:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow)}
.panel-body{padding:20px}
label{display:block;font-size:12px;font-weight:600;color:var(--bsn);margin:0 0 6px}
input,select{
  width:100%;border:1px solid var(--line);border-radius:2px;padding:10px 12px;font:inherit;font-size:14px;
  background:var(--surface);color:var(--text);margin-bottom:14px
}
.btn{width:100%;border:none;background:var(--bsn);color:#fff;padding:12px;border-radius:2px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.btn:hover{background:var(--bsn-deep)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.err{color:var(--danger);font-size:13px;margin-top:8px;min-height:18px}
.result{margin-top:16px;padding:14px;border-radius:2px;border:1px solid var(--line);background:var(--bsn-soft);display:none;font-size:14px;line-height:1.55}
.result.show{display:block}
.result.bad{border-color:#f0b4ae;background:var(--danger-bg)}
.result.warn{border-color:#f0d78c;background:#fff8e8}
.result.good{border-color:#b7e0cc;background:var(--success-bg)}
.badge{display:inline-block;padding:3px 8px;border-radius:2px;font-size:11px;font-weight:700;margin-left:6px}
.badge.SUSPICIOUS{background:var(--danger-bg);color:var(--danger)}
.badge.PENDING_REVIEW{background:#fff6e5;color:var(--warn)}
.badge.NORMAL{background:var(--success-bg);color:var(--success)}
@media(max-width:768px){
  .navbar{flex-direction:column;align-items:flex-start}
  .nav-links{width:100%}
}
</style>
<script>(function(){try{if(localStorage.getItem("theme")==="dark")document.documentElement.classList.add("dark");}catch(e){}})();</script>
<link rel="stylesheet" href="css/theme-dark.css">
<script src="js/theme.js" defer></script>

<link rel="stylesheet" href="css/app-shell.css">
<script>(function(){try{if(localStorage.getItem("theme")==="dark")document.documentElement.classList.add("dark");}catch(e){}})();</script>
<link rel="stylesheet" href="css/theme-dark.css">
</head>
<body>
<div class="navbar">
  <div class="brand">
    <div class="brand-mark">BSN</div>
    <div>
      <h2>BSN Fraud Detection</h2>
      <span>Transaction Checker</span>
    </div>
  </div>
  <div class="nav-links">
    <span class="who" id="userName">Admin</span>
    <a href="dashboard.html">Dashboard</a>
    <a href="admin-review.html">Case Review</a>
    <a class="active" href="checker.html">Checker</a>
    <a href="history.html">History</a>
    <a href="admin-reports.html">Reports</a>
    <a href="admin-users.html">Users</a>
    <a href="profile.html">Profile</a>
    <button type="button" id="themeBtn" data-theme-btn onclick="toggleTheme()">Dark Mode</button>
    <button type="button" class="logout-btn" onclick="logout()">Logout</button>

  </div>
</div>

<div class="page">
  <div class="page-title">
    <h1>Transaction risk checker</h1>
    <p>Manually analyse a transaction with the hybrid detection engine.</p>
  </div>
  <div class="panel">
    <div class="panel-body">
      <label for="accountNumber">Account number</label>
      <input id="accountNumber" placeholder="e.g. ACC123456" autocomplete="off">

      <label for="amount">Amount (RM)</label>
      <input id="amount" type="number" step="0.01" min="0" placeholder="e.g. 1500">

      <label for="location">Location</label>
      <input id="location" placeholder="e.g. Kuala Lumpur">

      <label for="transactionType">Transaction type</label>
      <select id="transactionType">
        <option value="TRANSFER">TRANSFER</option>
        <option value="PAYMENT">PAYMENT</option>
        <option value="WITHDRAWAL">WITHDRAWAL</option>
        <option value="DEPOSIT">DEPOSIT</option>
      </select>

      <button class="btn" id="btn" type="button" onclick="checkTransaction()">Analyse Transaction</button>
      <div class="err" id="err"></div>
      <div class="result" id="result"></div>
    </div>
  </div>
</div>

<script src="js/page-transitions.js" defer></script>
<script>
const API = "https://fraud-detection-system-j4bg.onrender.com";
const role = (sessionStorage.getItem("role") || "").toUpperCase();
if (sessionStorage.getItem("isLoggedIn") !== "true" || (role !== "ADMIN" && role !== "SUPER_ADMIN")) {
  window.location.href = "access.html";
}

document.getElementById("userName").textContent =
  sessionStorage.getItem("fullName") || sessionStorage.getItem("username") || "Admin";

function logout() {
  sessionStorage.clear();
  window.location.href = "access.html";
}

async function checkTransaction() {
  const err = document.getElementById("err");
  const result = document.getElementById("result");
  const btn = document.getElementById("btn");
  err.textContent = "";
  result.className = "result";
  result.style.display = "none";

  const accountNumber = document.getElementById("accountNumber").value.trim();
  const amount = parseFloat(document.getElementById("amount").value);
  const location = document.getElementById("location").value.trim();
  const transactionType = document.getElementById("transactionType").value;

  if (!accountNumber || !location || isNaN(amount) || amount < 0) {
    err.textContent = "Please fill account number, a valid amount, and location.";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Analysing…";

  try {
    const res = await fetch(API + "/api/transactions/check", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ accountNumber, amount, location, transactionType })
    });
    if (!res.ok) throw new Error("Server error " + res.status);
    const tx = await res.json();

    const status = tx.status || "NORMAL";
    const level = tx.riskLevel || "—";
    const score = tx.riskScore != null ? tx.riskScore : "—";
    let reasons = tx.reasons;
    if (!reasons && tx.reasonsJson) {
      reasons = String(tx.reasonsJson).split("||");
    }
    if (!Array.isArray(reasons)) reasons = [];

    let label = "CLEARED";
    let cls = "good";
    if (status === "SUSPICIOUS") { label = "FLAGGED"; cls = "bad"; }
    else if (status === "PENDING_REVIEW") { label = "PENDING REVIEW"; cls = "warn"; }

    result.className = "result show " + cls;
    result.style.display = "block";
    result.innerHTML =
      "<strong>Status:</strong> " + label +
      " <span class='badge " + status + "'>" + status + "</span><br>" +
      "<strong>Risk score:</strong> " + score + "% · <strong>Level:</strong> " + level + "<br>" +
      "<strong>Account:</strong> " + (tx.accountNumber || accountNumber) + "<br>" +
      "<strong>Amount:</strong> RM " + Number(tx.amount != null ? tx.amount : amount).toFixed(2) + "<br>" +
      "<strong>Location:</strong> " + (tx.location || location) + "<br>" +
      (reasons.length ? "<strong>Reasons:</strong><br>• " + reasons.map(r => String(r)).join("<br>• ") : "");
  } catch (e) {
    err.textContent = "Could not analyse transaction. Server may be waking up — try again.";
  } finally {
    btn.disabled = false;
    btn.textContent = "Analyse Transaction";
  }
}
</script>

<script src="js/theme.js" defer></script>
<script src="js/app-shell.js" defer></script>
<script src="js/page-transitions.js" defer></script>
</body>
</html>

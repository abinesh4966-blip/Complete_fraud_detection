<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Transaction History - BSN</title>

    <style>

@import url('https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&display=swap');
:root {
    --bg: #e9eef5;
    --surface: #ffffff;
    --border: #c5d0de;
    --text: #1a2332;
    --muted: #5c6b7c;
    --accent: #003366;
    --accent-hover: #00244d;
    --clay: #c4a35a;
    --danger: #b42318;
    --success: #0f6b4c;
    --warn: #a67c2a;
    --soft: #f4f7fb;
}
body.dark {
    --bg: #0b1a33;
    --surface: #12233f;
    --border: #2a3f5f;
    --text: #e8eef6;
    --muted: #9aadc2;
    --accent: #6ea8e0;
    --accent-hover: #8fbfec;
    --clay: #d4b56a;
    --danger: #f0a29a;
    --success: #7dba9a;
    --warn: #e0b45c;
    --soft: #18304f;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: var(--bg); color: var(--text);
    font-family: 'Libre Franklin', system-ui, sans-serif; min-height: 100vh;
    transition: background .25s, color .25s;
}
.navbar {
    background: #003366; color: #fff;
    border-bottom: 1px solid rgba(255,255,255,.12);
    padding: 14px 22px; display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 10px;
}
body.dark .navbar { background: #061224; }
.navbar h2 { color: #fff; font-size: 16px; font-weight: 700; letter-spacing: .02em; }
.nav-links { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.nav-links a, .nav-links button {
    color: #fff; text-decoration: none; background: transparent;
    border: 1px solid rgba(255,255,255,.35); padding: 7px 12px; border-radius: 2px;
    font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
}
.nav-links a:hover, .nav-links button:hover { background: rgba(255,255,255,.12); }
.logout-btn { background: rgba(180,35,24,.25) !important; border-color: rgba(240,180,174,.5) !important; }
.user-info { color: rgba(255,255,255,.85); font-size: 13px; }
.container { max-width: 1200px; margin: 0 auto; padding: 22px 16px 40px; }
.header-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.header-row h1 { font-size: 22px; color: var(--accent); font-weight: 700; }
body.dark .header-row h1 { color: #9ec5ea; }
.live-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.live-status { font-size: 12px; color: var(--muted); font-weight: 600; }
.btn {
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    padding: 8px 14px; border-radius: 2px; font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: inherit;
}
.btn:hover { filter: brightness(0.98); }
.btn-start { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-stop { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn-upload { background: var(--accent); color: #fff; border-color: var(--accent); }
.cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 14px 0 18px; }
@media (max-width: 900px) { .cards { grid-template-columns: repeat(2, 1fr); } }
.card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 2px; padding: 14px 16px;
}
.card h3 { font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
.card .number { font-size: 26px; font-weight: 700; color: var(--accent); }
.card.suspicious .number { color: var(--danger); }
.card.normal .number { color: var(--success); }
.card.false-positive .number { color: var(--warn); }
.main-grid { display: grid; grid-template-columns: 1.1fr 1fr 1fr; gap: 14px; }
@media (max-width: 1000px) { .main-grid { grid-template-columns: 1fr; } }
.panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: 2px; overflow: hidden;
    display: flex; flex-direction: column; min-height: 280px;
}
.panel-header {
    padding: 12px 14px; border-bottom: 1px solid var(--border);
    font-size: 13px; font-weight: 700; color: var(--accent);
    display: flex; justify-content: space-between; align-items: center;
}
.panel-body { padding: 12px 14px; overflow: auto; max-height: 420px; flex: 1; }
.empty { color: var(--muted); font-size: 13px; text-align: center; padding: 28px 10px; line-height: 1.5; }
.upload-box { padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.upload-msg { font-size: 12px; color: var(--muted); width: 100%; }
.feed-item {
    border: 1px solid var(--border); border-radius: 2px; padding: 10px; margin-bottom: 8px;
    background: var(--soft); cursor: pointer; font-size: 13px;
}
.feed-item .row { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
.feed-item .acc { font-weight: 700; color: var(--accent); }
.feed-item .amt { font-weight: 600; }
.status-line { font-size: 12px; font-weight: 700; margin-top: 4px; }
.status-line.flagged { color: var(--danger); }
.status-line.cleared { color: var(--success); }
.status-line.processing { color: var(--warn); }
.reason { font-size: 12px; color: var(--muted); margin-top: 4px; }

.filters { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; align-items:end; }
.filters label { font-size:12px; font-weight:600; color:var(--accent); display:block; margin-bottom:4px; }
.filters input { height:38px; border:1px solid var(--border); border-radius:2px; padding:0 10px; font:inherit; }
table { width:100%; border-collapse:collapse; background:var(--surface); border:1px solid var(--border); border-radius:2px; }
th, td { padding:10px 8px; border-bottom:1px solid var(--border); text-align:left; font-size:13px; }
th { color:var(--muted); font-size:12px; background:var(--soft); }

</style>

</head>


<body>


<div class="navbar">

    <h2>
        BSN · Admin
    </h2>

    <div class="nav-links">

        <span
            class="user-info"
            id="userName">
            Admin
        </span>

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="checker.html">
            Checker
        </a>

        <a href="history.html">
            History
        </a>

        <button
            class="logout-btn"
            onclick="logout()">
            Logout
        </button>

    </div>

</div>


<div class="container">

    <div class="card">

        <div class="title-row">

            <h1>
                Transaction History
            </h1>

            <div>

                <button
                    class="btn-danger"
                    onclick="clearAllHistory()">
                    Clear All Transaction History
                </button>

                <div class="warning-text">
                    Permanently deletes all transactions and resets ML.
                </div>

            </div>

        </div>


        <div class="filter-bar">

            <div class="filter-group">

                <label>
                    From Date
                </label>

                <input
                    type="date"
                    id="fromDate">

            </div>


            <div class="filter-group">

                <label>
                    To Date
                </label>

                <input
                    type="date"
                    id="toDate">

            </div>


            <button
                class="btn-filter"
                onclick="applyFilter()">
                Apply Filter
            </button>


            <button
                class="btn-clear"
                onclick="clearFilter()">
                Clear
            </button>

        </div>


        <div
            class="result-count"
            id="resultCount">
        </div>


        <div id="content">

            <div class="loading">
                Loading history records...
            </div>

        </div>

    </div>

</div>


<script>


/*
 * ADMIN ACCESS CHECK
 */
const __role = (sessionStorage.getItem("role") || "").toUpperCase();
    if (sessionStorage.getItem("isLoggedIn") !== "true" || (__role !== "ADMIN" && __role !== "SUPER_ADMIN")) {
        window.location.href = "access.html";
    }


document.getElementById("userName").textContent =
    sessionStorage.getItem("fullName") || "Admin";


/*
 * LOGOUT
 */
function logout() {

    sessionStorage.clear();

    window.location.href = "access.html";
}


/*
 * INACTIVITY TIMEOUT
 */
let inactivityTime = 2 * 60 * 1000;

let logoutTimer;


function resetLogoutTimer() {

    clearTimeout(logoutTimer);

    logoutTimer = setTimeout(() => {

        sessionStorage.clear();

        alert(
            "Session expired due to inactivity."
        );

        window.location.href =
            "access.html";

    }, inactivityTime);
}


window.onload = resetLogoutTimer;

document.onmousemove = resetLogoutTimer;

document.onkeypress = resetLogoutTimer;

document.onclick = resetLogoutTimer;


/*
 * TRANSACTION STORAGE
 */
let allTransactions = [];


/*
 * MARK FALSE POSITIVE
 */
async function markFalsePositive(id) {

    if (
        !confirm(
            "Mark this transaction as False Positive?"
        )
    ) {
        return;
    }


    try {

        const response = await fetch(
            `https://fraud-detection-system-j4bg.onrender.com/api/transactions/${id}/false-positive`,
            {
                method: "PUT"
            }
        );


        const result =
            await response.json();


        if (result.success) {

            alert(
                "Marked as False Positive"
            );

            loadHistory();

        } else {

            alert(
                result.message ||
                "Failed to update transaction."
            );
        }


    } catch (error) {

        console.error(error);

        alert(
            "Failed to connect to server."
        );
    }
}


/*
 * CLEAR ALL TRANSACTIONS
 */
async function clearAllHistory() {

    const confirmed = confirm(
        "⚠ WARNING ⚠\n\n" +

        "This will permanently delete ALL " +
        "transaction history for ALL accounts.\n\n" +

        "The Isolation Forest ML model will also " +
        "be reset.\n\n" +

        "This action cannot be undone.\n\n" +

        "Are you absolutely sure?"
    );


    if (!confirmed) {
        return;
    }


    try {

        const response = await fetch(
            "https://fraud-detection-system-j4bg.onrender.com/api/transactions/clear-all",
            {
                method: "DELETE"
            }
        );


        if (!response.ok) {

            throw new Error(
                "Server returned " +
                response.status
            );
        }


        const result =
            await response.json();


        if (result.success) {

            alert(
                result.deleted +
                " transaction(s) deleted.\n\n" +
                "Isolation Forest has been reset."
            );

            allTransactions = [];

            document.getElementById(
                "resultCount"
            ).textContent = "";

            document.getElementById(
                "content"
            ).innerHTML =
                "<div class='empty-msg'>" +
                "No transactions recorded yet." +
                "</div>";

        } else {

            alert(
                result.message ||
                "Failed to clear transaction history."
            );
        }


    } catch (error) {

        console.error(error);

        alert(
            "Unable to connect to the server."
        );
    }
}


/*
 * RENDER TABLE
 */
function renderTable(data) {

    if (data.length === 0) {

        document.getElementById(
            "content"
        ).innerHTML =
            "<div class='empty-msg'>" +
            "No transactions found." +
            "</div>";

        document.getElementById(
            "resultCount"
        ).textContent = "";

        return;
    }


    document.getElementById(
        "resultCount"
    ).textContent =
        `Showing ${data.length} transaction(s)`;


    let html = `

        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>ACCOUNT</th>

                    <th>AMOUNT</th>

                    <th>TYPE</th>

                    <th>LOCATION</th>

                    <th>RISK</th>

                    <th>STATUS</th>

                    <th>TIME</th>

                    <th>ACTION</th>

                </tr>

            </thead>

            <tbody>

    `;


    data.forEach(tx => {


        let statusClass =
            "status-normal";

        let statusText =
            "CLEARED";


        if (tx.falsePositive) {

            statusClass =
                "status-false";

            statusText =
                "FALSE POSITIVE";

        } else if (
            tx.status === "SUSPICIOUS"
        ) {

            statusClass =
                "status-suspicious";

            statusText =
                "FLAGGED";
        }


        let actionBtn = "";


        if (
            tx.status === "SUSPICIOUS" &&
            !tx.falsePositive
        ) {

            actionBtn = `

                <button
                    class="btn-fp"
                    onclick="markFalsePositive(${tx.id})">

                    Mark FP

                </button>

            `;
        }


        html += `

            <tr>

                <td>
                    ${tx.id}
                </td>

                <td>
                    ${tx.accountNumber || "-"}
                </td>

                <td>
                    RM ${Number(tx.amount || 0).toFixed(2)}
                </td>

                <td>
                    ${tx.transactionType || "-"}
                </td>

                <td>
                    ${tx.location || "-"}
                </td>

                <td>
                    ${Number(tx.riskScore || 0)}%
                </td>

                <td class="${statusClass}">
                    ${statusText}
                </td>

                <td>
                    ${
                        tx.timestamp
                            ? tx.timestamp
                                .replace("T", " ")
                                .substring(0, 19)
                            : "-"
                    }
                </td>

                <td>
                    ${actionBtn}
                </td>

            </tr>

        `;
    });


    html += `

            </tbody>

        </table>

    `;


    document.getElementById(
        "content"
    ).innerHTML = html;
}


/*
 * APPLY DATE FILTER
 */
function applyFilter() {

    const fromDate =
        document.getElementById(
            "fromDate"
        ).value;


    const toDate =
        document.getElementById(
            "toDate"
        ).value;


    let filtered =
        [...allTransactions];


    if (fromDate) {

        const from =
            new Date(fromDate);

        from.setHours(
            0, 0, 0, 0
        );


        filtered =
            filtered.filter(
                tx =>
                    tx.timestamp &&
                    new Date(tx.timestamp) >= from
            );
    }


    if (toDate) {

        const to =
            new Date(toDate);

        to.setHours(
            23, 59, 59, 999
        );


        filtered =
            filtered.filter(
                tx =>
                    tx.timestamp &&
                    new Date(tx.timestamp) <= to
            );
    }


    renderTable(
        filtered.reverse()
    );
}


/*
 * CLEAR DATE FILTER
 */
function clearFilter() {

    document.getElementById(
        "fromDate"
    ).value = "";


    document.getElementById(
        "toDate"
    ).value = "";


    renderTable(
        [...allTransactions].reverse()
    );
}


/*
 * LOAD HISTORY
 */
async function loadHistory() {

    try {

        const response =
            await fetch(
                "https://fraud-detection-system-j4bg.onrender.com/api/transactions/history"
            );


        if (!response.ok) {

            throw new Error(
                "Server returned " +
                response.status
            );
        }


        allTransactions =
            await response.json();


        if (
            allTransactions.length === 0
        ) {

            document.getElementById(
                "content"
            ).innerHTML =
                "<div class='empty-msg'>" +
                "No transactions recorded yet." +
                "</div>";

            return;
        }


        renderTable(
            [...allTransactions].reverse()
        );


    } catch (error) {

        console.error(error);

        document.getElementById(
            "content"
        ).innerHTML =
            "<div class='empty-msg' " +
            "style='color:#b42318;'>" +
            "Error loading history." +
            "</div>";
    }
}


/*
 * INITIAL LOAD
 */
loadHistory();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>History · BSN FDS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&display=swap');
:root{
  --bsn:#003366; --bsn-deep:#00244d; --bsn-soft:#e8eef6; --gold:#c4a35a;
  --bg:#eef2f7; --surface:#ffffff; --line:#cdd7e5; --text:#1a2332; --muted:#5c6b7c;
  --danger:#b42318; --danger-bg:#fdecea; --success:#0f6b4c; --success-bg:#e8f6ef;
  --warn:#9a6b12; --shadow:0 10px 28px rgba(0,38,77,.07); --radius:4px;
}
body.dark{
  --bg:#0b1a33; --surface:#12233f; --line:#2a3f5f; --text:#e8eef6; --muted:#9aadc2;
  --bsn-soft:#18304f; --shadow:0 10px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Libre Franklin',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
.navbar{background:var(--bsn);color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
body.dark .navbar{background:#061224}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:36px;height:36px;border-radius:2px;background:rgba(255,255,255,.12);display:grid;place-items:center;font-weight:700;font-size:12px}
.brand h2{font-size:16px;font-weight:700}
.brand span{display:block;font-size:11px;opacity:.75;font-weight:500}
.nav-links{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nav-links .who{font-size:13px;opacity:.9;margin-right:4px}
.nav-links a,.nav-links button{color:#fff;text-decoration:none;background:transparent;border:1px solid rgba(255,255,255,.32);padding:8px 12px;border-radius:2px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.nav-links a:hover,.nav-links button:hover{background:rgba(255,255,255,.12)}
.nav-links a.active{background:#fff;color:var(--bsn);border-color:#fff}
.logout-btn{border-color:rgba(240,180,174,.55)!important;background:rgba(180,35,24,.22)!important}
.page{max-width:1180px;margin:0 auto;padding:28px 20px 48px}
.page-title{margin-bottom:20px}
.page-title h1{font-size:24px;color:var(--bsn);font-weight:700;margin-bottom:6px}
body.dark .page-title h1{color:#9ec5ea}
.page-title p{color:var(--muted);font-size:14px}
.card,.panel,.toolbar,.stat{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)
}
.toolbar{padding:18px 20px;margin-bottom:20px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.stats{grid-template-columns:1fr}}
.stat{padding:18px 16px;min-height:110px;display:flex;flex-direction:column;justify-content:space-between}
.stat .label{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.stat .value{font-size:28px;font-weight:700;color:var(--bsn);margin-top:10px}
body.dark .stat .value{color:#9ec5ea}
.stat.flag .value{color:var(--danger)}
.stat.ok .value{color:var(--success)}
.panel{overflow:hidden;margin-bottom:18px}
.panel-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel-head h2{font-size:15px;color:var(--bsn);font-weight:700}
body.dark .panel-head h2{color:#9ec5ea}
.panel-body{padding:14px 16px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:16px}
@media(max-width:1000px){.grid-2,.grid-3{grid-template-columns:1fr}}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:10px 14px;border-radius:2px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.btn-primary{background:var(--bsn);color:#fff;border-color:var(--bsn)}
.btn-primary:hover{background:var(--bsn-deep)}
.btn-danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn-ghost{background:transparent;color:var(--bsn)}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;background:var(--bsn-soft);color:var(--muted);border:1px solid var(--line)}
.pill.on{background:var(--success-bg);color:var(--success);border-color:#b7e0cc}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:36px 16px;line-height:1.6}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--bsn-soft);font-weight:700}
label{display:block;font-size:12px;font-weight:600;color:var(--bsn);margin:0 0 6px}
body.dark label{color:#9ec5ea}
input,select,textarea{
  width:100%;border:1px solid var(--line);border-radius:2px;padding:10px 12px;font:inherit;font-size:14px;
  background:var(--surface);color:var(--text);margin-bottom:12px
}
.badge{display:inline-block;padding:4px 10px;border-radius:2px;font-size:11px;font-weight:700}
.badge.cleared,.badge.NORMAL{background:var(--success-bg);color:var(--success)}
.badge.flagged,.badge.SUSPICIOUS,.badge.ADMIN{background:var(--danger-bg);color:var(--danger)}
.badge.SUPER_ADMIN{background:#fff6e5;color:var(--warn)}
.badge.USER{background:var(--bsn-soft);color:var(--bsn)}
.badge.LOCK{background:var(--danger-bg);color:var(--danger)}
.feed-item{border:1px solid var(--line);border-radius:2px;padding:12px;margin-bottom:10px;background:var(--bsn-soft);cursor:pointer;font-size:13px}
.feed-item .row{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px}
.msg{margin-top:10px;padding:10px 12px;border-radius:2px;font-size:13px}
.msg.ok{background:var(--success-bg);color:var(--success);border:1px solid #b7e0cc}
.msg.err{background:var(--danger-bg);color:var(--danger);border:1px solid #f0b4ae}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-bottom:14px}
.filters > div{min-width:140px}
canvas{max-width:100%}
</style>
</head>
<body>
<div class="navbar">
  <div class="brand"><div class="brand-mark">BSN</div><div><h2>BSN Fraud Detection</h2><span>Transaction History</span></div></div>
  <div class="nav-links">
    <span class="who" id="userName">Admin</span>
    <a href="dashboard.html">Dashboard</a>
    <a href="checker.html">Checker</a>
    <a class="active" href="history.html">History</a>
    <a href="admin-reports.html">Reports</a>
    <a href="admin-users.html">Users</a>
    <button type="button" class="logout-btn" onclick="logout()">Logout</button>
  </div>
</div>
<div class="page">
  <div class="page-title">
    <h1>Transaction history</h1>
    <p>Filter and review all screened transactions.</p>
  </div>
  <div class="toolbar">
    <div class="filters">
      <div><label>From</label><input type="datetime-local" id="fromDate"></div>
      <div><label>To</label><input type="datetime-local" id="toDate"></div>
      <div><button class="btn btn-primary" type="button" onclick="applyFilters()">Apply filter</button></div>
      <div><button class="btn" type="button" onclick="clearFilters()">Clear</button></div>
      <div><span class="pill" id="resultCount">0 results</span></div>
    </div>
  </div>
  <div class="panel">
    <div class="panel-head"><h2>Results</h2></div>
    <div class="panel-body" id="content"><div class="empty">Loading…</div></div>
  </div>
</div>
<script>
/*
 * ADMIN ACCESS CHECK
 */
const __role = (sessionStorage.getItem("role") || "").toUpperCase();
    if (sessionStorage.getItem("isLoggedIn") !== "true" || (__role !== "ADMIN" && __role !== "SUPER_ADMIN")) {
        window.location.href = "access.html";
    }


document.getElementById("userName").textContent =
    sessionStorage.getItem("fullName") || "Admin";


/*
 * LOGOUT
 */
function logout() {

    sessionStorage.clear();

    window.location.href = "access.html";
}


/*
 * INACTIVITY TIMEOUT
 */
let inactivityTime = 2 * 60 * 1000;

let logoutTimer;


function resetLogoutTimer() {

    clearTimeout(logoutTimer);

    logoutTimer = setTimeout(() => {

        sessionStorage.clear();

        alert(
            "Session expired due to inactivity."
        );

        window.location.href =
            "access.html";

    }, inactivityTime);
}


window.onload = resetLogoutTimer;

document.onmousemove = resetLogoutTimer;

document.onkeypress = resetLogoutTimer;

document.onclick = resetLogoutTimer;


/*
 * TRANSACTION STORAGE
 */
let allTransactions = [];


/*
 * MARK FALSE POSITIVE
 */
async function markFalsePositive(id) {

    if (
        !confirm(
            "Mark this transaction as False Positive?"
        )
    ) {
        return;
    }


    try {

        const response = await fetch(
            `https://fraud-detection-system-j4bg.onrender.com/api/transactions/${id}/false-positive`,
            {
                method: "PUT"
            }
        );


        const result =
            await response.json();


        if (result.success) {

            alert(
                "Marked as False Positive"
            );

            loadHistory();

        } else {

            alert(
                result.message ||
                "Failed to update transaction."
            );
        }


    } catch (error) {

        console.error(error);

        alert(
            "Failed to connect to server."
        );
    }
}


/*
 * CLEAR ALL TRANSACTIONS
 */
async function clearAllHistory() {

    const confirmed = confirm(
        "⚠ WARNING ⚠\n\n" +

        "This will permanently delete ALL " +
        "transaction history for ALL accounts.\n\n" +

        "The Isolation Forest ML model will also " +
        "be reset.\n\n" +

        "This action cannot be undone.\n\n" +

        "Are you absolutely sure?"
    );


    if (!confirmed) {
        return;
    }


    try {

        const response = await fetch(
            "https://fraud-detection-system-j4bg.onrender.com/api/transactions/clear-all",
            {
                method: "DELETE"
            }
        );


        if (!response.ok) {

            throw new Error(
                "Server returned " +
                response.status
            );
        }


        const result =
            await response.json();


        if (result.success) {

            alert(
                result.deleted +
                " transaction(s) deleted.\n\n" +
                "Isolation Forest has been reset."
            );

            allTransactions = [];

            document.getElementById(
                "resultCount"
            ).textContent = "";

            document.getElementById(
                "content"
            ).innerHTML =
                "<div class='empty-msg'>" +
                "No transactions recorded yet." +
                "</div>";

        } else {

            alert(
                result.message ||
                "Failed to clear transaction history."
            );
        }


    } catch (error) {

        console.error(error);

        alert(
            "Unable to connect to the server."
        );
    }
}


/*
 * RENDER TABLE
 */
function renderTable(data) {

    if (data.length === 0) {

        document.getElementById(
            "content"
        ).innerHTML =
            "<div class='empty-msg'>" +
            "No transactions found." +
            "</div>";

        document.getElementById(
            "resultCount"
        ).textContent = "";

        return;
    }


    document.getElementById(
        "resultCount"
    ).textContent =
        `Showing ${data.length} transaction(s)`;


    let html = `

        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>ACCOUNT</th>

                    <th>AMOUNT</th>

                    <th>TYPE</th>

                    <th>LOCATION</th>

                    <th>RISK</th>

                    <th>STATUS</th>

                    <th>TIME</th>

                    <th>ACTION</th>

                </tr>

            </thead>

            <tbody>

    `;


    data.forEach(tx => {


        let statusClass =
            "status-normal";

        let statusText =
            "CLEARED";


        if (tx.falsePositive) {

            statusClass =
                "status-false";

            statusText =
                "FALSE POSITIVE";

        } else if (
            tx.status === "SUSPICIOUS"
        ) {

            statusClass =
                "status-suspicious";

            statusText =
                "FLAGGED";
        }


        let actionBtn = "";


        if (
            tx.status === "SUSPICIOUS" &&
            !tx.falsePositive
        ) {

            actionBtn = `

                <button
                    class="btn-fp"
                    onclick="markFalsePositive(${tx.id})">

                    Mark FP

                </button>

            `;
        }


        html += `

            <tr>

                <td>
                    ${tx.id}
                </td>

                <td>
                    ${tx.accountNumber || "-"}
                </td>

                <td>
                    RM ${Number(tx.amount || 0).toFixed(2)}
                </td>

                <td>
                    ${tx.transactionType || "-"}
                </td>

                <td>
                    ${tx.location || "-"}
                </td>

                <td>
                    ${Number(tx.riskScore || 0)}%
                </td>

                <td class="${statusClass}">
                    ${statusText}
                </td>

                <td>
                    ${
                        tx.timestamp
                            ? tx.timestamp
                                .replace("T", " ")
                                .substring(0, 19)
                            : "-"
                    }
                </td>

                <td>
                    ${actionBtn}
                </td>

            </tr>

        `;
    });


    html += `

            </tbody>

        </table>

    `;


    document.getElementById(
        "content"
    ).innerHTML = html;
}


/*
 * APPLY DATE FILTER
 */
function applyFilter() {

    const fromDate =
        document.getElementById(
            "fromDate"
        ).value;


    const toDate =
        document.getElementById(
            "toDate"
        ).value;


    let filtered =
        [...allTransactions];


    if (fromDate) {

        const from =
            new Date(fromDate);

        from.setHours(
            0, 0, 0, 0
        );


        filtered =
            filtered.filter(
                tx =>
                    tx.timestamp &&
                    new Date(tx.timestamp) >= from
            );
    }


    if (toDate) {

        const to =
            new Date(toDate);

        to.setHours(
            23, 59, 59, 999
        );


        filtered =
            filtered.filter(
                tx =>
                    tx.timestamp &&
                    new Date(tx.timestamp) <= to
            );
    }


    renderTable(
        filtered.reverse()
    );
}


/*
 * CLEAR DATE FILTER
 */
function clearFilter() {

    document.getElementById(
        "fromDate"
    ).value = "";


    document.getElementById(
        "toDate"
    ).value = "";


    renderTable(
        [...allTransactions].reverse()
    );
}


/*
 * LOAD HISTORY
 */
async function loadHistory() {

    try {

        const response =
            await fetch(
                "https://fraud-detection-system-j4bg.onrender.com/api/transactions/history"
            );


        if (!response.ok) {

            throw new Error(
                "Server returned " +
                response.status
            );
        }


        allTransactions =
            await response.json();


        if (
            allTransactions.length === 0
        ) {

            document.getElementById(
                "content"
            ).innerHTML =
                "<div class='empty-msg'>" +
                "No transactions recorded yet." +
                "</div>";

            return;
        }


        renderTable(
            [...allTransactions].reverse()
        );


    } catch (error) {

        console.error(error);

        document.getElementById(
            "content"
        ).innerHTML =
            "<div class='empty-msg' " +
            "style='color:#b42318;'>" +
            "Error loading history." +
            "</div>";
    }
}


/*
 * INITIAL LOAD
 */
loadHistory();
</script>
</body>
</html>

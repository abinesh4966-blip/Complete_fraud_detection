<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transaction Checker · BSN FDS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&display=swap');
:root{
  --bsn:#003366; --bsn2:#00244d; --bg:#e9eef5; --card:#fff; --line:#c5d0de;
  --text:#1a2332; --muted:#5c6b7c; --danger:#b42318; --ok:#0f6b4c;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Libre Franklin',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.nav{
  background:var(--bsn);color:#fff;padding:14px 22px;
  display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
}
.nav .links{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.nav a,.nav button{
  color:#fff;text-decoration:none;background:transparent;border:1px solid rgba(255,255,255,.35);
  padding:7px 12px;border-radius:2px;font:inherit;font-size:13px;cursor:pointer;
}
.nav a:hover,.nav button:hover{background:rgba(255,255,255,.12)}
.wrap{max-width:560px;margin:0 auto;padding:28px 16px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:2px;
  padding:22px;box-shadow:0 8px 24px rgba(0,38,77,.06);
}
h1{font-size:22px;color:var(--bsn);margin-bottom:6px}
.sub{color:var(--muted);font-size:13px;margin-bottom:18px}
label{display:block;font-size:12px;font-weight:600;margin:12px 0 6px;color:var(--bsn2)}
input,select{
  width:100%;height:42px;border:1px solid var(--line);border-radius:2px;
  padding:0 12px;font:inherit;font-size:14px;
}
button.primary{
  width:100%;height:44px;margin-top:18px;border:none;border-radius:2px;
  background:var(--bsn);color:#fff;font:inherit;font-weight:700;cursor:pointer;
}
button.primary:hover{background:var(--bsn2)}
button.primary:disabled{opacity:.65;cursor:not-allowed}
.result{
  margin-top:16px;padding:14px;border-radius:2px;border:1px solid var(--line);
  background:#f4f7fb;display:none;font-size:14px;line-height:1.5;
}
.result.show{display:block}
.result.bad{border-color:#f0b4ae;background:#fdecea}
.result.good{border-color:#b7e0cc;background:#e8f6ef}
.msg{margin-top:12px;color:var(--danger);font-size:13px}
</style>
</head>
<body>
  <div class="nav">
    <strong>BSN · Transaction Checker</strong>
    <div class="links">
      <span id="userName" style="opacity:.9;font-size:13px"></span>
      <a href="dashboard.html">Dashboard</a>
      <a href="history.html">History</a>
      <a href="admin-users.html">Users</a>
      <a href="index.html">Checker</a>
      <button type="button" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="wrap">
    <div class="card">
      <h1>Transaction Risk Checker</h1>
      <p class="sub">Manually analyse a transaction with the hybrid detection engine.</p>

      <label for="accountNumber">Account number</label>
      <input id="accountNumber" placeholder="e.g. ACC123456">

      <label for="amount">Amount (RM)</label>
      <input id="amount" type="number" step="0.01" min="0" placeholder="e.g. 1500">

      <label for="location">Location</label>
      <input id="location" placeholder="e.g. Kuala Lumpur">

      <label for="transactionType">Transaction type</label>
      <select id="transactionType">
        <option value="TRANSFER">TRANSFER</option>
        <option value="PAYMENT">PAYMENT</option>
        <option value="WITHDRAWAL">WITHDRAWAL</option>
        <option value="DEPOSIT">DEPOSIT</option>
      </select>

      <button class="primary" id="btn" type="button" onclick="checkTransaction()">Analyse Transaction</button>
      <div class="msg" id="err"></div>
      <div class="result" id="result"></div>
    </div>
  </div>

<script>
const API = "https://fraud-detection-system-j4bg.onrender.com";

const role = (sessionStorage.getItem("role") || "").toUpperCase();
if (sessionStorage.getItem("isLoggedIn") !== "true" || (role !== "ADMIN" && role !== "SUPER_ADMIN")) {
  window.location.href = "access.html";
}

document.getElementById("userName").textContent =
  sessionStorage.getItem("fullName") || sessionStorage.getItem("username") || "Admin";

function logout() {
  sessionStorage.clear();
  window.location.href = "access.html";
}

// Optional inactivity logout (10 min — less aggressive for QA)
let logoutTimer;
function resetLogoutTimer() {
  clearTimeout(logoutTimer);
  logoutTimer = setTimeout(() => {
    sessionStorage.clear();
    alert("Session expired due to inactivity.");
    window.location.href = "access.html";
  }, 10 * 60 * 1000);
}
["mousemove","keypress","onclick","scroll","touchstart"].forEach(ev => {
  document.addEventListener(ev, resetLogoutTimer);
});
resetLogoutTimer();

async function checkTransaction() {
  const err = document.getElementById("err");
  const box = document.getElementById("result");
  err.textContent = "";
  box.className = "result";
  box.innerHTML = "";

  const accountNumber = document.getElementById("accountNumber").value.trim();
  const amount = parseFloat(document.getElementById("amount").value);
  const location = document.getElementById("location").value.trim();
  const transactionType = document.getElementById("transactionType").value;

  if (!accountNumber || !location || isNaN(amount) || amount < 0) {
    err.textContent = "Please fill account number, valid amount, and location.";
    return;
  }

  const btn = document.getElementById("btn");
  btn.disabled = true;
  btn.textContent = "Analysing…";

  try {
    const res = await fetch(API + "/api/transactions/check", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        accountNumber,
        amount,
        location,
        transactionType
      })
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();

    const status = data.status || "UNKNOWN";
    const score = data.riskScore != null ? data.riskScore : "—";
    const level = data.riskLevel || "";
    const reasons = Array.isArray(data.reasons) ? data.reasons : (data.reason ? [data.reason] : []);
    const bad = String(status).toUpperCase() === "SUSPICIOUS";

    box.className = "result show " + (bad ? "bad" : "good");
    box.innerHTML = `
      <b>Status:</b> ${status}${level ? " (" + level + ")" : ""}<br>
      <b>Risk score:</b> ${score}%<br>
      <b>Account:</b> ${data.accountNumber || accountNumber}<br>
      <b>Amount:</b> RM ${data.amount != null ? data.amount : amount}<br>
      <b>Location:</b> ${data.location || location}<br>
      <b>Type:</b> ${data.transactionType || transactionType}<br>
      <b>Reasons:</b><br>${reasons.length ? reasons.map(r => "• " + r).join("<br>") : "—"}
    `;
  } catch (e) {
    err.textContent = "Server offline or waking up. Wait and try again.";
  } finally {
    btn.disabled = false;
    btn.textContent = "Analyse Transaction";
  }
}
</script>
</body>
</html>
